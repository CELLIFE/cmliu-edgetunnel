name: Sync and Obfuscate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-obfuscate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Obfuscator
        run: npm install javascript-obfuscator

      - name: Download and overwrite files
        run: |
          curl -fsSL --max-time 60 "https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js" -o "明文源吗"

      - name: Obfuscate from local source file
        run: |
          cat > obfuscate.js << 'EOF'
          const JavaScriptObfuscator = require('javascript-obfuscator');
          const fs = require('fs');
          const path = require('path');

          const sourceFileName = '明文源吗';
          const outputFileNames = ['worker.js', '_worker.js'];
          const sourceFilePath = path.join(process.cwd(), sourceFileName);

          if (!fs.existsSync(sourceFilePath)) {
            console.error('错误：在路径 \'' + sourceFilePath + '\' 未找到源文件。');
            process.exit(1);
          }

          const originalCode = fs.readFileSync(sourceFilePath, 'utf8');

          if (!originalCode || originalCode.trim().length === 0) {
            console.error('错误：源文件 ' + sourceFileName + ' 为空。');
            process.exit(1);
          }

          const obfuscationOptions = {
            compact: true,
            controlFlowFlattening: false,
            deadCodeInjection: false,
            stringArray: true,
            stringArrayEncoding: ['base64'],
            stringArrayThreshold: 1.0,
            stringArrayRotate: true,
            stringArrayShuffle: true,
            stringArrayWrappersCount: 2,
            stringArrayWrappersChainedCalls: false,
            stringArrayWrappersParametersMaxCount: 3,
            renameGlobals: false,
            identifierNamesGenerator: 'mangled-shuffled',
            ignoreImports: true,
            target: 'browser-no-eval',
            numbersToExpressions: false,
            simplify: false,
            splitStrings: true,
            splitStringsChunkLength: 3,
            transformObjectKeys: false,
            unicodeEscapeSequence: true,
            selfDefending: false,
            debugProtection: false,
            debugProtectionInterval: 0,
            disableConsoleOutput: false,
            domainLock: []
          };

          const originalSize = Buffer.byteLength(originalCode, 'utf8');
          console.log('原始大小: ' + (originalSize / 1024).toFixed(2) + ' KB');

          for (const outputFileName of outputFileNames) {
            try {
              console.log('开始混淆：' + sourceFileName + ' → ' + outputFileName);
              const obfuscatedCode = JavaScriptObfuscator.obfuscate(originalCode, obfuscationOptions).getObfuscatedCode();
              fs.writeFileSync(path.join(process.cwd(), outputFileName), obfuscatedCode, 'utf8');
              const obfuscatedSize = Buffer.byteLength(obfuscatedCode, 'utf8');
              console.log('混淆后大小: ' + (obfuscatedSize / 1024).toFixed(2) + ' KB');
              console.log('膨胀率: ' + ((obfuscatedSize / originalSize) * 100).toFixed(1) + '%');
              console.log('完成：\'' + sourceFileName + '\' → \'' + outputFileName + '\'');
            } catch (err) {
              console.error('混淆失败：' + err.message);
              console.error(err.stack);
              process.exit(1);
            }
          }
          EOF
          node obfuscate.js

      - name: Generate SHA256 checksums
        id: hash
        run: |
          # 生成 SHA256SUMS（标准格式，可被 sha256sum -c 校验）
          sha256sum worker.js _worker.js > SHA256SUMS
          echo "----- SHA256SUMS -----"
          cat SHA256SUMS

          # 单独提取每个文件的哈希，供 Release 说明使用
          HASH_WORKER=$(sha256sum worker.js | awk '{print $1}')
          HASH_UNDERSCORE=$(sha256sum _worker.js | awk '{print $1}')
          echo "hash_worker=${HASH_WORKER}" >> "$GITHUB_OUTPUT"
          echo "hash_underscore=${HASH_UNDERSCORE}" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 仓库保留明文源码与 _worker.js；worker.js 仅在 Release 中
          git add "明文源吗" "_worker.js"
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes, skipping commit."
          else
            git commit -m "sync & obfuscate: update from cmliu/edgetunnel@main"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete existing latest release & tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: |
            ## 自动发布（固定 Tag: `latest`）

            - **上游来源**: `cmliu/edgetunnel@main`
            - **触发 commit**: ${{ github.sha }}
            - **运行编号**: #${{ github.run_number }}

            ### 产物

            | 文件 | 用途 | 固定下载链接 |
            |------|------|--------------|
            | `worker.js` | Cloudflare Worker 部署 | `https://github.com/${{ github.repository }}/releases/latest/download/worker.js` |
            | `_worker.js` | Cloudflare Pages（高级模式） | `https://github.com/${{ github.repository }}/releases/latest/download/_worker.js` |

            > 两个文件各自独立混淆，内容不同（随机字符串数组、标识符等），但功能一致。

            ### SHA256

            | 文件 | SHA256 |
            |------|--------|
            | `worker.js` | `${{ steps.hash.outputs.hash_worker }}` |
            | `_worker.js` | `${{ steps.hash.outputs.hash_underscore }}` |

            ```
            ${{ steps.hash.outputs.hash_worker }}  worker.js
            ${{ steps.hash.outputs.hash_underscore }}  _worker.js
            ```

            也可下载 [`SHA256SUMS`](https://github.com/${{ github.repository }}/releases/latest/download/SHA256SUMS) 后本地校验：

            ```bash
            sha256sum -c SHA256SUMS
            ```
          files: |
            worker.js
            _worker.js
            SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
